name: Build Hassati Arabic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -e

          cat Hassati-part-aa Hassati-part-ab Hassati-part-ac > Hassati-Sleepy-Arabic-stage1.zip
          unzip -q Hassati-Sleepy-Arabic-stage1.zip

          cd sleepy-main

          sed -i 's#https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip#https://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Install Arabic strings
        shell: bash
        run: |
          set -e

          cp strings.xml sleepy-main/app/src/main/res/values-ar/strings.xml

      - name: Add Arabic to LocaleHelper
        shell: bash
        run: |
          set -e

          FILE=$(find sleepy-main -type f -name "LocaleHelper.kt" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "LocaleHelper.kt not found"
            exit 1
          fi

          echo "Found: $FILE"

          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text(encoding="utf-8")

          old = '    "es" -> Locale("es")\n    else -> Locale.getDefault()'

          new = '    "es" -> Locale("es")\n    "ar" -> Locale("ar")\n    else -> Locale.getDefault()'

          if '"ar" -> Locale("ar")' not in text:
              if old not in text:
                  print("Expected LocaleHelper code was not found.")
                  print("No changes were made.")
                  sys.exit(1)

              text = text.replace(old, new, 1)
              file.write_text(text, encoding="utf-8")

          print("Arabic locale added successfully.")
          PY

      - name: Configure Android app languages
        shell: bash
        run: |
          set -e

          mkdir -p sleepy-main/app/src/main/res/xml

          cat > sleepy-main/app/src/main/res/xml/locales_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <locale-config xmlns:android="http://schemas.android.com/apk/res/android">
              <locale android:name="ar" />
              <locale android:name="en" />
              <locale android:name="es" />
              <locale android:name="ja" />
              <locale android:name="zh-CN" />
              <locale android:name="zh-TW" />
          </locale-config>
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("sleepy-main/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          if "android:localeConfig=" not in text:
              text = re.sub(
                  r'(<application\b)',
                  r'\1\n        android:localeConfig="@xml/locales_config"',
                  text,
                  count=1
              )

              manifest.write_text(text, encoding="utf-8")

          print("Android locale configuration ready.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools" "platforms;android-35"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd sleepy-main

          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassati-arabic-debug-apk
          path: sleepy-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
