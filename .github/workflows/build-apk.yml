name: Extract LocaleHelper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -e

          cat Hassati-part-aa Hassati-part-ab Hassati-part-ac > Hassati-Sleepy-Arabic-stage1.zip

          unzip -q Hassati-Sleepy-Arabic-stage1.zip

      - name: Find LocaleHelper
        shell: bash
        run: |
          set -e

          FILE=$(find sleepy-main -type f -name "LocaleHelper.kt" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "LocaleHelper.kt not found"
            echo "Searching all Kotlin files:"
            find sleepy-main -type f -name "*.kt" | sort
            exit 1
          fi

          echo "Found:"
          echo "$FILE"

          cp "$FILE" LocaleHelper.kt

      - name: Upload LocaleHelper
        uses: actions/upload-artifact@v4
        with:
          name: LocaleHelper
          path: LocaleHelper.kt
          if-no-files-found: error
          retention-days: 30
