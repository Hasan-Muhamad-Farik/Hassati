name: Build Hassati APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -e
          cat Hassati-part-aa Hassati-part-ab Hassati-part-ac > Hassati-Sleepy-Arabic-stage1.zip
          unzip -q Hassati-Sleepy-Arabic-stage1.zip
          cd sleepy-main
          sed -i 's#https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip#https://services.gradle.org/distributions/gradle-9.3.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
                - name: Extract Arabic strings
        run: |
          cp sleepy-main/app/src/main/res/values-ar/strings.xml arabic-strings.xml

      - name: Upload Arabic strings
        uses: actions/upload-artifact@v4
        with:
          name: arabic-strings
          path: arabic-strings.xml
      - name: Inspect Android project
        shell: bash
        run: |
          set -e
          cd sleepy-main

          {
            echo "=== PROJECT FILES ==="
            find app/src/main -type f | sort

            echo
            echo "=== STRING RESOURCES ==="
            find app/src/main/res -type f -path '*/values*/strings.xml' -print

            echo
            echo "=== LOCALE DIRECTORIES ==="
            find app/src/main/res -maxdepth 1 -type d -name 'values*' | sort

            echo
            echo "=== HARD-CODED TEXT CANDIDATES ==="
            grep -RInE 'Text\(|android:text=|setText\(|contentDescription' app/src/main \
              --include='*.kt' \
              --include='*.java' \
              --include='*.xml' || true
          } > ../hassati-project-report.txt

      - name: Upload project report
        uses: actions/upload-artifact@v4
        with:
          name: Hassati-project-report
          path: hassati-project-report.txt
          if-no-files-found: error
          retention-days: 7
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platform-tools" "platforms;android-35"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd sleepy-main
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassati-debug-apk
          path: sleepy-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
