name: Extract AppPrefs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -e

          cat Hassati-part-aa Hassati-part-ab Hassati-part-ac > Hassati-Sleepy-Arabic-stage1.zip
          unzip -q Hassati-Sleepy-Arabic-stage1.zip

      - name: Find AppPrefs
        shell: bash
        run: |
          set -e

          FILE=$(find sleepy-main -type f -name "AppPrefs.kt" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "AppPrefs.kt not found"
            echo "Searching for Kotlin files containing AppPrefs:"
            grep -RIl "AppPrefs" sleepy-main --include="*.kt" | head -20 || true
            exit 1
          fi

          echo "Found: $FILE"
          cp "$FILE" AppPrefs.kt

      - name: Upload AppPrefs
        uses: actions/upload-artifact@v4
        with:
          name: AppPrefs
          path: AppPrefs.kt
          if-no-files-found: error
          retention-days: 30
